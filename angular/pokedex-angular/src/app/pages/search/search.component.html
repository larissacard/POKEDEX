<app-navbar></app-navbar>

<div class="container">
  <div class="container__header">
    <app-search-bar (searchPokemon)="searchPokemon($event)"></app-search-bar>

  <div class="container__body">
    <ul>

      </li>
    </ul>
  </div>
</div>
