<div class="container">
  <div class="logo-image">
    <img src="../../../assets/image 1.svg" alt="pokemon logo" />
  </div>
  <span>Comece a coletar pokémons!</span>
  <div class="login">
    <form>
      <input
        type="text"
        name="txt"
        class="form.control"
        placeholder="Email"
        [(ngModel)]="userLogin.email"
      />
      <input
        type="password"
        name="password"
        class="form.control"
        placeholder="Senha"
        [(ngModel)]="userLogin.password"
      />
      <button (click)="OnSingUp()">Entrar</button>
    </form>
  </div>
</div>
